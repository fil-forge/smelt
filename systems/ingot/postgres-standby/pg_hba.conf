# ingot-postgres's client authentication under compose.pg-standby.yml,
# passed as hba_file. The first seven lines are what the postgres image
# writes on initialization; the last admits replication connections, which
# `all` in the database column does not cover. Dev-only credentials.
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
host    all             all             all                     scram-sha-256
host    replication     ingot           all                     scram-sha-256
