# Ingot configuration for the smelt compose stack.
#
# Mounted read-only at /etc/ingot/config.yaml. Env overrides use the
# INGOT_ prefix (e.g. INGOT_LOG_LEVEL).

# S3 listener — bind 0.0.0.0 so other containers / the host port can reach it.
# Port 80 inside the compose network: did:web:ingot resolves to
# http://ingot:80/.well-known/did.json (the stack's did:web convention).
addr: "0.0.0.0:80"
region: us-west-1
data_dir: /data
log_level: info

# Single-account S3 IAM (demo credentials).
root_access: ingot
root_secret: ingotsecret

# Agent identity: the signer of every invocation ingot issues (to hilt, sprue,
# piri), wrapped as did:web:ingot. The key is generated by `make generate`
# into generated/keys/ingot.pem and mounted read-only; ingot serves the
# matching DID document at /.well-known/did.json so the peers can resolve the
# did:web to it. The hilt → ingot proof and hilt's provider registration both
# name did:web:ingot.
identity:
  key_file: /keys/ingot.pem
  service_id: did:web:ingot

# Registry / segment metadata.
postgres_dsn: "postgres://ingot:ingot@ingot-postgres:5432/ingot?sslmode=disable"

# Forge upload service (sprue) — control plane for /blob/add etc.
upload_service_url: "http://upload:80"
upload_service_did: "did:web:upload"
upload_receipts_url: "http://upload:80/receipt"

# Indexing service — read-path locator (digest -> location commitment).
indexer_endpoint: "http://indexer:80"
indexer_did: "did:web:indexer"

# S3 authorization service (hilt).
auth_service_url: "http://hilt:80"
auth_service_did: "did:web:hilt"
# hilt → ingot delegations for /s3/request/authorize and /s3/bucket/*
auth_service_proofs: "/proofs/hilt-ingot-s3-proof.txt"

# UCAN revocation service (swarf) — ingot subscribes to its revocation
# firehose so hilt's access-key deletions clear the per-key authorization
# caches. Set both or neither.
revocation_service_url: "http://swarf:80"
revocation_service_did: "did:web:swarf"

# Per-plane shipping is configurable; defaults ship both planes. To keep
# the MST catalog local-only (provider-regional, never shipped), the
# daemon honours per-plane ship flags — see ingot's Config.

# Region CEK wrap (regional security RFC): the wrap runs inside
# ingot-openbao's transit engine, so the region KEK never enters ingot. The
# token comes from INGOT_REGIONKEY_OPENBAO_TOKEN in compose.yml. Ingot builds
# that predate the openbao provider (fil-forge/ingot#105) ignore this block.
regionkey:
  provider: openbao
  openbao:
    address: "http://ingot-openbao:8200"
    mount: transit
    key: region-kek

# Tenant wrap key (FEE tenant recipient): ingot resolves the tenant's did:plc
# document from the PLC directory and encrypts every stored object to the
# X25519 key hilt publishes at the tenant's #wrap verification method. Writes
# fail without it. Ingot builds that predate the tenant recipient ignore
# this block.
tenantkey:
  plc_directory_url: "http://plc:3000"
