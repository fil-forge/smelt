# ingot daemon config — smelt forge mode (in-network).
#
# Mounted read-only at /etc/ingot/config.yaml. Env overrides use the
# INGOT_ prefix (e.g. INGOT_LOG_LEVEL).

mode: forge

# S3 listener — bind 0.0.0.0 so other containers / the host port can reach it.
addr: "0.0.0.0:9000"
region: us-east-1
data_dir: /data

# Single-account S3 IAM (demo credentials).
root_access: ingot
root_secret: ingotsecret

# Agent identity (the signer that invokes against sprue). Generated by
# `make generate` into generated/keys/ingot.pem and mounted read-only.
identity:
  key_file: /keys/ingot.pem

# Registry / segment metadata.
postgres_dsn: "postgres://ingot:ingot@ingot-postgres:5432/ingot?sslmode=disable"

# Forge upload service (sprue) — control plane for /blob/add etc.
upload_service_url: "http://upload:80"
upload_service_did: "did:web:upload"
upload_receipts_url: "http://upload:80/receipt"

# Indexing service — read-path locator (digest -> location commitment).
indexer_endpoint: "http://indexer:80"
indexer_did: "did:web:indexer"

# Login-derived delegations (tokens.cbor) persist here.
token_store_dir: /data

# Per-plane shipping is configurable; defaults ship both planes. To keep
# the MST catalog local-only (provider-regional, never shipped), the
# daemon honours per-plane ship flags — see ingot's Config.
