# Common System - Shared infrastructure services
#
# MinIO for S3-compatible object storage.
# Used by: upload
#
# SMTP4Dev for email testing.
# Used by: upload

services:
  # MinIO for S3-compatible storage
  minio:
    image: ${MINIO_IMAGE:-ghcr.io/fil-forge/minio:RELEASE.2025-10-15T17-29-55Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${SMELT_MINIO_S3_PORT:-15070:9000}"        # S3 API
      - "${SMELT_MINIO_CONSOLE_PORT:-15071:9001}"   # Console
    volumes:
      - minio-data:/data
    healthcheck:
      # Our build carries no mc: upstream shipped the client in the same
      # image and this healthcheck was its only use here.
      # /minio/health/cluster stays 503 until the object layer is up;
      # live and ready both answer 200 too early.
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/cluster"]
      start_interval: 1s
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - forge-network
  email:
    image: ${SMTP4DEV_IMAGE:-rnwood/smtp4dev:v3}
    ports:
      - "${SMELT_SMTP_PORT:-15080:25}"
      - "${SMELT_SMTP_WEB_PORT:-15081:80}"  # Web UI / API
    networks:
      - forge-network

volumes:
  minio-data:
