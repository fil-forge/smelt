# Signing Service System - PDP operation signing for Piri
#
# Signs blockchain transactions for Proof of Data Possession (PDP).
# Used by: piri

services:
  signing-service:
    image: ${SIGNER_IMAGE:-ghcr.io/fil-forge/piri-signing-service:main}
    user: root
    ports:
      - "${SMELT_SIGNING_SERVICE_PORT:-15030:7446}"
    volumes:
      - ../../generated/keys/payer-key.hex:/keys/payer-key.hex:ro
      - ../../generated/keys/signing-service.pem:/keys/signing-service.pem:ro
      - ./config/signer.yaml:/signer.yaml:ro
    command: [
      "--host", "0.0.0.0",
      "--port", "7446",
      "--rpc-url", "ws://blockchain:8545",
      "--service-contract-address", "0xE6E340D132b5f46d1e472DebcD681B2aBc16e57E",
      "--signing-key-path", "/keys/payer-key.hex",
      "--service-key-file", "/keys/signing-service.pem",
      "--service-did", "did:web:signing-service",
      # Piri nodes invoke as did:web:piri-<n>%3A3000, served over plain HTTP.
      "--insecure-did-resolution"
    ]
    depends_on:
      blockchain:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7446/healthcheck"]
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - forge-network
