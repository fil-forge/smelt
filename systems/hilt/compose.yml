# Hilt System - Forge tenant-management service
#
# Implements the Fil One Tenant API (partner-key REST) and a UCAN RPC API
# (for Ingot). Publishes tenant did:plc identities to the local PLC directory
# and registers tenants as customers with the upload service (sprue).
# Used by: external partner tooling / Ingot (not yet in the stack)

services:
  hilt:
    image: ${HILT_IMAGE:-ghcr.io/fil-forge/hilt:main}
    user: "0:0"  # Run as root for volume permissions (key files are 600)
    ports:
      # Internal port 80 for did:web resolution
      - "${SMELT_HILT_PORT:-15110:80}"
    environment:
      - HILT_SERVER_HOST=0.0.0.0
      - HILT_SERVER_PORT=80
      - HILT_IDENTITY_KEY_FILE=/keys/hilt.pem
      - HILT_IDENTITY_SERVICE_ID=did:web:hilt
      # Local-dev pre-shared bearer key for the Tenant API (not a production secret)
      - HILT_AUTH_PARTNER_KEY=${HILT_PARTNER_KEY:-dev-partner-key}
      - HILT_STORAGE_TYPE=postgres
      - HILT_STORAGE_POSTGRES_DSN=postgres://hilt:hilt@hilt-postgres:5432/hilt?sslmode=disable
      # OTLP/HTTP collector for hilt's traces; tracing is off when empty.
      # With systems/telemetry running: OTEL_ENDPOINT=http://otel-collector:4318
      # OTEL_EXPORTER_OTLP_ENDPOINT in the shell works too; OTEL_ENDPOINT wins.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_ENDPOINT:-${OTEL_EXPORTER_OTLP_ENDPOINT:-}}
      # Bare: taken from the shell when set, absent otherwise, and an empty
      # value changes nothing. OTEL_TRACES_SAMPLER_ARG is the share of requests
      # traced (default 1); OTEL_RESOURCE_ATTRIBUTES labels every span, e.g.
      # with a run ID. OTEL_METRIC_EXPORT_INTERVAL is how often the service
      # exports its metrics, if it exports any, in milliseconds (the SDK's
      # default is 60000).
      - OTEL_TRACES_SAMPLER_ARG
      - OTEL_RESOURCE_ATTRIBUTES
      - OTEL_METRIC_EXPORT_INTERVAL
      # OpenBao holds the tenant/access-key private keys (see hilt-vault below)
      - HILT_VAULT_TYPE=openbao
      - HILT_VAULT_OPENBAO_ADDRESS=http://hilt-vault:8200
      - HILT_VAULT_OPENBAO_AUTH_METHOD=token
      # Scoped token hilt-vault-init provisions (local dev only, like the
      # partner key above)
      - HILT_VAULT_OPENBAO_TOKEN=${HILT_VAULT_TOKEN:-dev-hilt-vault-token}
      - HILT_PLC_DIRECTORY=http://plc:3000
      - HILT_UPLOAD_SERVICE_ID=did:web:upload
      - HILT_UPLOAD_SERVICE_URL=http://upload:80
      # Swarf revocation service — hilt publishes UCAN revocations here when
      # a delegation it issued is withdrawn (e.g. access-key deletion)
      - HILT_REVOCATION_SERVICE_ID=did:web:swarf
      - HILT_REVOCATION_SERVICE_URL=http://swarf:80
      - HILT_UPLOAD_PRODUCT_ID=did:web:hilt
      - HILT_UPLOAD_PROOFS=/proofs/hilt-customer-add-proof.txt
      # Resolve did:web documents over plain HTTP inside the compose network
      # (the UCAN validator needs this to verify did:web-issued invocations).
      - HILT_SERVER_INSECURE_DID_RESOLUTION=true
      - HILT_LOG_LEVEL=info
    volumes:
      - ../../generated/keys/hilt.pem:/keys/hilt.pem:ro
      - ../../generated/proofs:/proofs:ro
    depends_on:
      upload:
        condition: service_healthy
      plc:
        condition: service_healthy
      swarf:
        condition: service_healthy
      hilt-postgres:
        condition: service_healthy
      # The vault is unsealed and hilt's token exists once the init job has run.
      hilt-vault-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/health"]
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - forge-network

  # One-shot registrar: registers ingot as hilt's regional provider once
  # hilt is healthy. Runs the hilt admin CLI from the same image; the
  # HILT_SERVER_* env points the CLI at the hilt container, and the identity
  # env lets it sign as the service. Previously a post_start hook on `hilt`
  # (see upload-init for why hooks were retired).
  hilt-init:
    image: ${HILT_IMAGE:-ghcr.io/fil-forge/hilt:main}
    user: "0:0"  # key files are 600
    entrypoint: ["sh", "/register-provider.sh"]
    environment:
      - HILT_SERVER_HOST=hilt
      - HILT_SERVER_PORT=80
      - HILT_IDENTITY_KEY_FILE=/keys/hilt.pem
      - HILT_IDENTITY_SERVICE_ID=did:web:hilt
      - INGOT_REGION=${INGOT_REGION:-us-west-1}
    volumes:
      - ../../generated/keys/hilt.pem:/keys/hilt.pem:ro
      # The piri node DID list only: this container needs the node
      # identities, never the node keys.
      - ../../generated/keys/piri-nodes.did:/piri-nodes.did:ro
      - ./register-provider.sh:/register-provider.sh:ro
    depends_on:
      hilt:
        condition: service_healthy
      # Provider registration pushes the piri node set to sprue as the
      # region's routing policy, and sprue only accepts nodes it has
      # registered.
      upload-init:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - forge-network

  # OpenBao for hilt's tenant/access-key private keys (the same server
  # production runs). A non-dev server with raft storage on hilt-vault-data,
  # so the keys survive down/up and snapshot restores alongside the tenant
  # and access-key rows in hilt-postgres. The healthcheck only means
  # "listening": a fresh server is uninitialized and a restarted one is sealed
  # until hilt-vault-init runs again (which `make up` does, since one-shot
  # services re-run on every up).
  hilt-vault:
    image: ${OPENBAO_IMAGE:-openbao/openbao:2.6}
    command: ["server"]
    ports:
      - "${SMELT_HILT_VAULT_PORT:-15112:8200}"
    environment:
      # For `docker compose exec hilt-vault bao ...` (the CLI defaults to https)
      - BAO_ADDR=http://127.0.0.1:8200
    volumes:
      - ./openbao/config.hcl:/openbao/config/config.hcl:ro
      - hilt-vault-data:/openbao/file
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8200/v1/sys/health?sealedcode=200&uninitcode=200"]
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - forge-network

  # One-shot initializer for hilt-vault: `operator init` on first boot (one
  # unseal share + root token kept on the hilt-vault-init volume, dev-only
  # custody), unseal on every boot, then make sure KV v2 at `secret`, the hilt
  # policy, and hilt's scoped token exist. See openbao/init.sh.
  hilt-vault-init:
    image: ${OPENBAO_IMAGE:-openbao/openbao:2.6}
    user: "0:0"  # the image runs as `openbao`; the init volume is root-owned
    entrypoint: ["sh", "/init.sh"]
    environment:
      - BAO_ADDR=http://hilt-vault:8200
      - HILT_VAULT_TOKEN=${HILT_VAULT_TOKEN:-dev-hilt-vault-token}
    volumes:
      - ./openbao/init.sh:/init.sh:ro
      - ../common/openbao/bootstrap.sh:/openbao-bootstrap.sh:ro
      - hilt-vault-init:/init
    depends_on:
      hilt-vault:
        condition: service_healthy
    restart: "no"
    networks:
      - forge-network

  # Postgres for hilt's tenant/provider/access-key stores. Hilt runs goose
  # migrations on startup, so the `hilt` database created by POSTGRES_DB is
  # enough — no init sidecar needed. Named hilt-postgres because `postgres`
  # is taken by upload's sidecar.
  hilt-postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    ports:
      - "${SMELT_HILT_POSTGRES_PORT:-15111:5432}"
    environment:
      - POSTGRES_USER=hilt
      - POSTGRES_PASSWORD=hilt
      - POSTGRES_DB=hilt
    volumes:
      - hilt-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hilt -d hilt"]
      start_interval: 1s
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - forge-network

volumes:
  hilt-postgres-data:
  hilt-vault-data:  # raft storage: tenant and access-key private keys
  hilt-vault-init:  # unseal share + root token (dev-only custody)
