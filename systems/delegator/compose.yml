# Delegator System - UCAN delegation service (registrar)
#
# Issues UCAN delegations to storage providers and keeps its allow list and
# provider info in Postgres.
# Used by: piri

services:
  delegator:
    image: ${DELEGATOR_IMAGE:-ghcr.io/fil-forge/delegator:main}
    user: "0:0"  # Run as root for volume permissions (key files are 600)
    ports:
      # Internal port 80 for did:web resolution
      - "${SMELT_DELEGATOR_PORT:-15040:80}"
    command: ["serve", "--host", "0.0.0.0", "--port", "80"]
    volumes:
      - ../../generated/keys/delegator.pem:/keys/delegator.pem:ro
      - ../../generated/proofs:/proofs:ro
      - ./config/delegator.yaml:/.delegator.yaml:ro
    depends_on:
      delegator-postgres:
        condition: service_healthy
      blockchain:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/healthcheck"]
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - forge-network

  # One-shot: puts every piri-N from smelt.yml on the allow list with the
  # delegator's own CLI, from the same image and config. Each generated piri
  # service waits for it to complete. See allow-piri.sh.
  delegator-init:
    image: ${DELEGATOR_IMAGE:-ghcr.io/fil-forge/delegator:main}
    user: "0:0"
    entrypoint: ["sh", "/allow-piri.sh"]
    volumes:
      - ../../generated/keys/piri-nodes.did:/piri-nodes.did:ro
      - ./config/delegator.yaml:/.delegator.yaml:ro
      - ./allow-piri.sh:/allow-piri.sh:ro
    depends_on:
      delegator:
        condition: service_healthy
    restart: "no"
    networks:
      - forge-network

  delegator-postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    ports:
      - "${SMELT_DELEGATOR_POSTGRES_PORT:-15041:5432}"
    environment:
      - POSTGRES_USER=delegator
      - POSTGRES_PASSWORD=delegator
      - POSTGRES_DB=delegator
    volumes:
      - delegator-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U delegator -d delegator"]
      start_interval: 1s
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - forge-network

volumes:
  delegator-postgres-data:
