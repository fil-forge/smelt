# Forge staging — CORE bundle.
#
# upload (sprue) + signing-service + delegator + hilt (tenant management) + plc
# (did:plc directory) + hilt-vault, plus their dependency containers (postgres,
# minio, dynamodb-local). Deployed independently of the piri bundle; the two talk
# over public https://*.staging.fil.one URLs (fronted by host Caddy).
#
# Postgres is a single shared instance: a dedicated `admin` superuser plus one
# role + database per service (sprue, hilt, plc), created by the postgres-init
# one-shot.
#
# Run via the deploy script, which supplies the env files:
#   docker compose -p forge-staging-core \
#     --env-file versions.env --env-file config.env --env-file secrets.env \
#     up -d
#
# All published ports bind to 127.0.0.1 (the box's UFW default-denies inbound and
# Docker's iptables can bypass it — loopback binding keeps these off the public
# interface; Caddy fronts them for TLS + did:web).
name: forge-staging-core

services:
  dynamodb-local:
    image: ${DYNAMODB_IMAGE}
    user: "0:0"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    volumes:
      - ${FORGE_DATA_DIR}/dynamodb:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':>/dev/tcp/127.0.0.1/8000'"]
      start_interval: 1s
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [forge-staging]

  postgres:
    image: ${POSTGRES_IMAGE}
    # Shared instance with a dedicated admin superuser. The per-service roles +
    # databases (sprue, hilt, plc) are created by postgres-init below; each
    # service runs its own migrations in its own database.
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${POSTGRES_ADMIN_PASSWORD}
    volumes:
      - ${FORGE_DATA_DIR}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d admin"]
      start_interval: 1s
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [forge-staging]

  # Create the per-service Postgres roles + databases once postgres is up.
  # Idempotent: guarded CREATEs (via \gexec — CREATE DATABASE cannot run inside
  # a DO block/transaction) plus an unconditional ALTER ROLE so a re-provisioned
  # password always applies. Exits 0; consumers wait on completion. Passwords
  # land inside SQL string literals — safe only because keygen secrets are hex
  # ([0-9a-f]), never quotes or backslashes.
  postgres-init:
    image: ${POSTGRES_IMAGE}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        export PGPASSWORD="$$POSTGRES_ADMIN_PASSWORD"
        ensure() {
          printf '%s\n' \
            "SELECT 'CREATE ROLE \"$$1\"' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '$$1')" \
            '\gexec' \
            "ALTER ROLE \"$$1\" WITH LOGIN PASSWORD '$$2';" \
            "SELECT 'CREATE DATABASE \"$$1\" OWNER \"$$1\"' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$$1')" \
            '\gexec' \
          | psql -h postgres -U admin -d admin -v ON_ERROR_STOP=1 --quiet
        }
        ensure sprue "$$SPRUE_POSTGRES_PASSWORD" &&
        ensure hilt "$$HILT_POSTGRES_PASSWORD" &&
        ensure plc "$$PLC_POSTGRES_PASSWORD" &&
        echo "postgres roles + databases ready"
    environment:
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      SPRUE_POSTGRES_PASSWORD: ${SPRUE_POSTGRES_PASSWORD}
      HILT_POSTGRES_PASSWORD: ${HILT_POSTGRES_PASSWORD}
      PLC_POSTGRES_PASSWORD: ${PLC_POSTGRES_PASSWORD}
    restart: "no"
    networks: [forge-staging]

  minio:
    image: ${MINIO_IMAGE}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:15072:9001" # console (optional, loopback only)
    volumes:
      - ${FORGE_DATA_DIR}/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      start_interval: 1s
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [forge-staging]

  # Create sprue's buckets once minio is up. Exits 0; sprue waits on completion.
  minio-init:
    image: ${MC_IMAGE}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb -p local/agent-message local/delegation local/upload-shards &&
        echo "buckets ready"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    restart: "no"
    networks: [forge-staging]

  signing-service:
    image: ${SIGNER_IMAGE}
    user: root
    ports:
      - "127.0.0.1:15030:7446"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${FORGE_SECRETS_DIR}/payer-key.hex:/keys/payer-key.hex:ro
      - ${FORGE_SECRETS_DIR}/signing-service.pem:/keys/signing-service.pem:ro
      # signer.yaml carries no secrets and is committed; mounted from the git tree.
      - ./config/signer/signer.yaml:/signer.yaml:ro
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "7446"
      - "--rpc-url"
      - "${LOTUS_RPC_URL}"
      - "--service-contract-address"
      - "${FWSS_ADDRESS}"
      - "--signing-key-path"
      - "/keys/payer-key.hex"
      - "--service-key-file"
      - "/keys/signing-service.pem"
      - "--service-did"
      - "${SIGNING_SERVICE_DID}"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7446/healthcheck"]
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [forge-staging]

  delegator:
    image: ${DELEGATOR_IMAGE}
    user: "0:0"
    ports:
      - "127.0.0.1:15040:80"
    command: ["serve", "--host", "0.0.0.0", "--port", "80"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${FORGE_SECRETS_DIR}/delegator.pem:/keys/delegator.pem:ro
      - ${FORGE_SECRETS_DIR}/delegator.yaml:/.delegator.yaml:ro
      # Committed delegation proofs (non-secret) come from the git tree.
      - ../proofs:/proofs:ro
    depends_on:
      dynamodb-local:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/healthcheck"]
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [forge-staging]

  sprue:
    image: ${SPRUE_IMAGE}
    command: ["serve", "--config", "/etc/sprue/config.yaml"]
    ports:
      - "127.0.0.1:15060:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # S3/MinIO credentials are read from the mounted sprue-config.yaml
      # (storage.s3.access_key_id / secret_access_key), not from AWS_* env vars.
      - SPRUE_SERVER_PUBLIC_URL=${SPRUE_PUBLIC_URL}
    volumes:
      - ${FORGE_SECRETS_DIR}/sprue.pem:/keys/sprue.pem:ro
      - ${FORGE_SECRETS_DIR}/sprue-config.yaml:/etc/sprue/config.yaml:ro
      # Committed delegation proofs (non-secret) — provider registration
      # (scripts/staging-register-piri.sh) passes /proofs/piri-N-proof.txt.
      - ../proofs:/proofs:ro
    # NOTE: unlike local dev, there is NO post_start provider-registration hook —
    # piri lives in a separate bundle. Register piri providers explicitly after
    # both bundles are healthy: `make staging-register-piri`.
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/health"]
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [forge-staging]

  # did:plc directory (tenant DIDs). INTERNAL ONLY by design: no published port,
  # no Caddy route, no DNS record — its only consumers are hilt and sprue inside
  # this bundle (http://plc:3000), so did:plc documents are NOT publicly
  # resolvable in staging.
  plc:
    image: ${PLC_IMAGE}
    environment:
      # The production entrypoint takes DB credentials as JSON, with a separate
      # (here: identical) credentialed user for startup migrations. The password
      # lands inside a JSON value — safe only because keygen secrets are hex
      # ([0-9a-f]), never quotes or backslashes.
      - DB_CREDS_JSON={"username":"plc","password":"${PLC_POSTGRES_PASSWORD}","host":"postgres","port":"5432","database":"plc"}
      - DB_MIGRATE_CREDS_JSON={"username":"plc","password":"${PLC_POSTGRES_PASSWORD}","host":"postgres","port":"5432","database":"plc"}
      - ENABLE_MIGRATIONS=true
      - LOG_ENABLED=true
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/_health"]
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks: [forge-staging]

  # HashiCorp Vault (PERSISTENT, sealed) for hilt's tenant/access-key private
  # keys. Integrated Raft storage on the ZFS pool survives restarts; the
  # hilt-vault-unseal sidecar unseals it on every (re)start with the key held in
  # 1Password. One-time init (operator init + KV v2 mount + storing the unseal
  # key/root token in 1Password) is done by `make staging-vault-init`; a
  # re-provision wipes /vault/file and requires re-running it.
  # See docs/STAGING_DEPLOY.md ("Persistent sealed Vault").
  hilt-vault:
    image: ${VAULT_IMAGE}
    # Start as root and use the STOCK entrypoint (command: server). When
    # docker-entrypoint.sh sees uid 0 it chowns the /vault/file data mount to the
    # `vault` user and then su-exec's down to it — so the root-owned host bind dir
    # becomes writable with no host-side chown. The `user: "0:0"` is REQUIRED: the
    # image's own default user is `vault`, which SKIPS that chown and then can't
    # write the bind mount (Raft fails with "permission denied"). The `-dev-*`
    # flags the entrypoint injects do NOT enable dev mode (needs `-dev`), so this
    # stays a real, sealed server, run by the unprivileged `vault` user.
    user: "0:0"
    command: server
    environment:
      - VAULT_ADDR=http://127.0.0.1:8200
      # vault.hcl disables mlock, so no IPC_LOCK capability is needed — and we
      # must skip the entrypoint's setcap step: the `setcap` binary isn't present
      # in this image and would abort startup ("setcap: not found", exit 127)
      # under the entrypoint's `set -e`.
      - SKIP_SETCAP=true
    volumes:
      - ./config/vault/vault.hcl:/vault/config/vault.hcl:ro
      - ${FORGE_DATA_DIR}/hilt-vault:/vault/file
    # /v1/sys/health returns non-2xx while sealed/uninitialized and 200 only when
    # unsealed+active, so this stays unhealthy until the unseal sidecar unseals —
    # exactly what hilt's `hilt-vault: service_healthy` dependency should wait for.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8200/v1/sys/health"]
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks: [forge-staging]

  # Unseal sidecar: a long-running poller that unseals hilt-vault whenever it is
  # found sealed — on first boot and after any restart (deploy recreate, box
  # reboot, `docker restart hilt-vault`). The unseal key comes from 1Password via
  # vault-secrets.env; it is never logged (output is discarded).
  hilt-vault-unseal:
    image: ${VAULT_IMAGE}
    depends_on:
      hilt-vault:
        # service_started, NOT service_healthy — Vault is unhealthy while sealed,
        # and unsealing it is precisely this sidecar's job.
        condition: service_started
    environment:
      - VAULT_ADDR=http://hilt-vault:8200
      - HILT_VAULT_UNSEAL_KEY=${HILT_VAULT_UNSEAL_KEY}
    entrypoint:
      - /bin/sh
      - -c
      - |
        # `vault status` exit code: 0=unsealed, 2=sealed, 1=error/unreachable.
        while true; do
          vault status >/dev/null 2>&1; s=$$?
          if [ "$$s" = "2" ]; then
            vault operator unseal "$$HILT_VAULT_UNSEAL_KEY" >/dev/null 2>&1 || true
          fi
          sleep 10
        done
    restart: unless-stopped
    networks: [forge-staging]

  # Tenant management: Fil One Tenant API (partner-key REST) + UCAN RPC (for
  # ingot) + did:web document at /.well-known/did.json. Publishes tenant did:plc
  # identities to plc and registers tenants as customers with sprue (authority =
  # the committed hilt-customer-add proof).
  hilt:
    image: ${HILT_IMAGE}
    user: "0:0" # run as root to read the 0440-perm key file
    ports:
      - "127.0.0.1:15110:80"
    environment:
      - HILT_SERVER_HOST=0.0.0.0
      - HILT_SERVER_PORT=80
      - HILT_IDENTITY_KEY_FILE=/keys/hilt.pem
      - HILT_IDENTITY_SERVICE_ID=${HILT_DID}
      - HILT_AUTH_PARTNER_KEY=${HILT_PARTNER_KEY}
      - HILT_STORAGE_TYPE=postgres
      - HILT_STORAGE_POSTGRES_DSN=postgres://hilt:${HILT_POSTGRES_PASSWORD}@postgres:5432/hilt?sslmode=disable
      - HILT_VAULT_TYPE=hashicorp
      - HILT_VAULT_HASHICORP_ADDRESS=http://hilt-vault:8200
      - HILT_VAULT_HASHICORP_AUTH_METHOD=token
      - HILT_VAULT_HASHICORP_TOKEN=${HILT_VAULT_TOKEN}
      - HILT_PLC_DIRECTORY=http://plc:3000
      - HILT_UPLOAD_SERVICE_ID=${SPRUE_DID}
      - HILT_UPLOAD_SERVICE_URL=${SPRUE_PUBLIC_URL}
      - HILT_UPLOAD_PRODUCT_ID=${HILT_DID}
      - HILT_UPLOAD_PROOFS=/proofs/hilt-customer-add-proof.txt
      # NOTE: unlike local dev, no HILT_SERVER_INSECURE_DID_RESOLUTION — staging
      # resolves did:web over real https through host Caddy.
      - HILT_LOG_LEVEL=info
    volumes:
      - ${FORGE_SECRETS_DIR}/hilt.pem:/keys/hilt.pem:ro
      # Committed delegation proofs (non-secret) come from the git tree.
      - ../proofs:/proofs:ro
    # NOTE: unlike local dev, there is NO post_start hook registering ingot as
    # the regional provider — ingot lives in the piri bundle. Register it
    # explicitly after both bundles are healthy: `make staging-register-ingot`.
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      plc:
        condition: service_healthy
      hilt-vault:
        condition: service_healthy
      sprue:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/health"]
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [forge-staging]

# Persistent data lives on the box's ZFS pool (see FORGE_DATA_DIR in config.env),
# not Docker named volumes — so no top-level `volumes:` block.

networks:
  forge-staging:
    name: forge-staging-core
