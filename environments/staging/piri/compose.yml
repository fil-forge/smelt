# Forge staging — PIRI bundle.
#
# A single piri storage node (sqlite + filesystem). Deployed independently of the
# core bundle; talks to core over public https://*.staging.fil.one URLs and to
# the host Lotus node via host-gateway.
#
# Run via the deploy script:
#   docker compose -p forge-staging-piri \
#     --env-file versions.env --env-file config.env up -d
#
# Published port binds to 127.0.0.1; host Caddy fronts piri-0.staging.fil.one.
name: forge-staging-piri

# *.staging.fil.one resolves to the box's PUBLIC IP, which a container cannot reach
# by hairpin NAT (connecting out to the host's own public address times out — this
# is what made `piri init`'s registrar request to the delegator hang). Map these
# hostnames to the host gateway so outbound calls reach the host's Caddy directly
# over the Docker bridge. Caddy still terminates TLS for the real hostname (SNI is
# preserved) and reverse-proxies to the loopback-published container port. Only
# hosts piri actually calls and that have a Caddy site are listed.
x-staging-hosts: &staging-hosts
  - "host.docker.internal:host-gateway"
  - "delegator.staging.fil.one:host-gateway"
  - "signing-service.staging.fil.one:host-gateway"
  - "sprue.staging.fil.one:host-gateway"

services:
  piri-0:
    image: ${PIRI_IMAGE}
    # The piri image runs as USER nobody, but the provisioned key files are
    # 0440 root:root and the host data dir is created root:root, so a non-root
    # process can neither read the keys nor write /data/piri. Run as root to
    # match the local-dev stack (pkg/generate emits user: "0:0" for piri too).
    user: "0:0"
    ports:
      - "127.0.0.1:15100:3000"
    extra_hosts: *staging-hosts
    entrypoint: ["/entrypoint.sh"]
    environment:
      - LOTUS_ENDPOINT=${LOTUS_RPC_URL}
      - PUBLIC_URL=${PIRI_PUBLIC_URL}
      - PORT=3000
      - HOST=0.0.0.0
      - REGISTRAR_URL=${REGISTRAR_URL}
      - OPERATOR_EMAIL=${OPERATOR_EMAIL}
      - PIRI_DB_BACKEND=sqlite
      - PIRI_BLOB_BACKEND=filesystem
    volumes:
      - ${FORGE_SECRETS_DIR}/piri-0.pem:/keys/piri.pem:ro
      - ${FORGE_SECRETS_DIR}/piri-0-wallet.hex:/keys/owner-wallet.hex:ro
      # Rendered from piri-base-config.toml.tpl at provision time (smart-contracts.env vars).
      - ${FORGE_SECRETS_DIR}/piri-base-config.toml:/config/piri-base-config.toml:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ${FORGE_DATA_DIR}/piri-0:/data/piri
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/readyz | grep -q '\"status\":\\s*\"ok\"'"]
      start_interval: 2s
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    restart: unless-stopped
    networks: [forge-staging-piri]

# Persistent data lives on the box's ZFS pool (see FORGE_DATA_DIR in config.env),
# not a Docker named volume.

networks:
  forge-staging-piri:
    name: forge-staging-piri
