# Smelt dev-mode overlay.
#
# When SMELT_DEV=1 the Makefile chains this file in after compose.yml. Each
# service below replaces its published-image entry with a build from a sibling
# checkout, so `make fresh` / `make build` rebuild containers from your local
# working trees.
#
# Layout assumption (sibling directories of smelt/):
#   ../sprue                  -> upload service (sprue)
#   ../indexing-service       -> indexer
#   ../piri-signing-service   -> signing-service
#   ../guppy                  -> guppy CLI
#   ../delegator              -> delegator
#
# Piri itself is handled by pkg/generate (which inlines a `build:` block into
# generated/compose/piri.yml when SMELT_DEV=1) because the number of piri-N
# services is dynamic and lives in a generated file.
#
# Image tags here are local-only (smelt-local/*) so they can't be confused
# with anything in a registry. `docker compose build` tags the local build
# with these names; `docker compose up` then uses them.

services:
  upload:
    image: smelt-local/upload:dev
    # Parent dir as context so the libforge sibling is reachable (sprue's
    # go.mod has `replace github.com/fil-forge/libforge => ../libforge` for
    # local dev). The smelt-owned Dockerfile mirrors the upstream sprue one
    # but lays out /src/sprue + /src/libforge instead of just /src.
    build:
      context: ..
      dockerfile: smelt/dockerfiles/sprue.Dockerfile

  indexer:
    image: smelt-local/indexer:dev
    build:
      context: ../indexing-service

  delegator:
    image: smelt-local/delegator:dev
    build:
      context: ../delegator

  signing-service:
    image: smelt-local/signer:dev
    # Parent context so piri-signing-service's go.mod `replace ../libforge`
    # resolves the sibling libforge tree (needed for the didresolver wrap fix
    # that lets did:web invocations from piri verify).
    build:
      context: ..
      dockerfile: smelt/dockerfiles/signing-service.Dockerfile

  guppy:
    image: smelt-local/guppy:dev
    # Dockerfile.dev bundles randdir (required for the upload test workflow
    # documented in CLAUDE.md) plus dlv and shell tools. The dlv entrypoint
    # in that image is overridden by `entrypoint: ["sleep", "infinity"]` in
    # the system compose, so the container stays interactive.
    build:
      context: ../guppy
      dockerfile: Dockerfile.dev
